name: Verify published archive
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download exact release archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'AutoTurn-*-macOS.zip' --dir artifacts
      - name: Extract archive
        run: |
          mkdir -p extracted
          ditto -x -k artifacts/AutoTurn-*-macOS.zip extracted
      - name: Native execution of published app, helper and engine
        run: bash scripts/smoke.sh "$PWD/extracted/AutoTurn.app"
